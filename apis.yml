aid: audio-up-media
name: Audio Up Media
description: 'Audio Up Media is a Los Angeles based podcast studio, music company and
  audio entertainment network founded in 2020 by Jared Gutstadt, the founder of Jingle
  Punks. The company develops and produces scripted and unscripted audio series, original
  music IP and branded audio campaigns, and adapts that intellectual property into
  television, film and live formats. Its catalog includes scripted titles such as Strawberry
  Spring, Make It Up As We Go, Where the Bodies Are Buried and Maejor Frequency, alongside
  branded case-study work for consumer brands. Audio Up is a content studio rather than
  a software platform: it publishes a marketing site and distributes its shows through
  third-party podcast platforms, and does not operate a developer program, public API,
  SDK or machine-readable specification of its own.'
